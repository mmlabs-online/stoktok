name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same Docker Hub account as the other mmlabs apps (calechip: mingming21400/calechip).
  # Secrets to set in GitHub settings: see README, "CI and Docker images".
  DOCKERHUB_NAMESPACE: mingming21400

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:service-key
      - run: pnpm check:deploy-env
      - run: pnpm db:check
        env:
          DB_CHECK_URL: postgresql://postgres:postgres@localhost:5432/postgres

  images:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, worker]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      # Until the Docker Hub secrets are set, main still builds and smoke-tests
      # the images but skips the push with a warning instead of turning red.
      - name: Check Docker Hub secrets
        if: env.PUSH == 'true'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; images are built and tested but not pushed"
            echo "SKIP_PUSH=true" >> "$GITHUB_ENV"
          fi
      - name: Compute image name
        run: echo "IMAGE=${DOCKERHUB_NAMESPACE:-local}/stoktok-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Image checks
        run: bash scripts/check-image.sh ${{ matrix.app }} "$IMAGE:latest"
      - name: Docker Hub login
        if: env.PUSH == 'true' && env.SKIP_PUSH != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push images
        if: env.PUSH == 'true' && env.SKIP_PUSH != 'true'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
