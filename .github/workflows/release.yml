# STK-037: pushing a tag vX.Y.Z builds and pushes stoktok-web and stoktok-worker, then opens a pull
# request release/stoktok-vX.Y.Z on mmlabs-online/deployment that changes only apps/stoktok/release.env
# (both images pinned by digest). Merging it runs deploy-stoktok on macbook-runner.
# Based on mmlabs-online/deployment docs/app-release.yml. Runbook: docs/deploy.md.
#
# Secrets in this repo:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  push to mingming21400/stoktok-*
#   DEPLOY_REPO_TOKEN                    fine-grained PAT on mmlabs-online/deployment only:
#                                        Contents read/write, Pull requests read/write

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: stoktok # folder apps/<APP>/ in the deployment repo
  NAMESPACE: mingming21400 # Docker Hub account

jobs:
  release:
    runs-on: ubuntu-latest # GitHub's runner: app code never runs on the home server
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: guards
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vX.Y.Z or vX.Y.Z-suffix"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: tag a commit on main"; exit 1
          fi
          for name in DH_USER DH_TOKEN DEPLOY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret for $name is empty (see docs/deploy.md, Repository secrets)"; exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.NAMESPACE }}/stoktok-web:${{ github.ref_name }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: build and push worker
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.NAMESPACE }}/stoktok-worker:${{ github.ref_name }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # Check the exact bytes that will be pinned. If this fails, no PR is opened.
      - name: verify pushed digests
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          for app in web worker; do
            case "$app" in web) digest="$WEB_DIGEST" ;; worker) digest="$WORKER_DIGEST" ;; esac
            ref="$NAMESPACE/stoktok-$app@$digest"
            docker pull "$ref"
            bash scripts/check-image.sh "$app" "$ref"
          done

      - name: pull request on the deployment repo
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          branch="release/$APP-$TAG"
          web_ref="$NAMESPACE/stoktok-web:$TAG@$WEB_DIGEST"
          worker_ref="$NAMESPACE/stoktok-worker:$TAG@$WORKER_DIGEST"
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/mmlabs-online/deployment.git" deployment
          cd deployment
          git switch -c "$branch"
          mkdir -p "apps/$APP"
          {
            echo "# Written by the $APP release workflow for $TAG (commit $GITHUB_SHA). Do not edit by hand."
            echo "STOKTOK_WEB_IMAGE=$web_ref"
            echo "STOKTOK_WORKER_IMAGE=$worker_ref"
            echo "STOKTOK_VERSION=$TAG"
          } > "apps/$APP/release.env"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/$APP/release.env"
          if [ "$(git diff --cached --name-only)" != "apps/$APP/release.env" ]; then
            echo "::error::release commit must change only apps/$APP/release.env"; exit 1
          fi
          git commit -m "$APP $TAG"
          git push origin "$branch"
          gh pr create --repo mmlabs-online/deployment --base main --head "$branch" \
            --title "$APP $TAG" \
            --body "Deploys \`$web_ref\` and \`$worker_ref\` ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA). Apply database migrations before merging. Merging runs deploy-$APP on macbook-runner."
