# Stoktok (mmlabs-online/stoktok) on the Mac runner host, project `stoktok`. The images come only
# from release.env, which the stoktok release workflow writes in a release/stoktok-vX.Y.Z pull
# request as
#   STOKTOK_WEB_IMAGE=mingming21400/stoktok-web:vX.Y.Z@sha256:<digest>
#   STOKTOK_WORKER_IMAGE=mingming21400/stoktok-worker:vX.Y.Z@sha256:<digest>
#   STOKTOK_VERSION=vX.Y.Z
# Merging it runs .github/workflows/deploy-stoktok.yml. By hand:
#   docker compose -p stoktok -f apps/stoktok/compose.yml --env-file apps/stoktok/release.env --profile migrate run --rm migrate
#   docker compose -p stoktok -f apps/stoktok/compose.yml --env-file apps/stoktok/release.env up -d --wait
#
# Web: Next.js on :3000, no ports: cloudflared reaches it as `stoktok-web` on the `web` network.
# Worker: one-shot jobs (profile `jobs`), started by run-job.sh from launchd, never by `up -d`.
# The worker is not on `web`.
#
# The server-only secrets are written to /Users/mingming/.config/stoktok/stoktok.env by deploy-stoktok,
# never stored in this repository: the Supabase keys and the AI provider keys from the `stoktok`
# environment secrets, the AI master key likewise, and the database URL derived from the committed
# postgres/secrets/apps/stoktok.password (STK-084). It sits outside the checkout because the runner's
# checkout deletes untracked files. If it is missing, `config` fails and nothing starts. `migrate`
# shares the env file and has no egress.
#
# Cutover state (STK-094): web is on `tunnel` + `db` and its health check is /readyz (a database round
# trip: 3 s client timeout; the route itself times out at 2 s and memoises for 3 s). The worker is on
# `default` + `db`. `migrate` is a one-shot on `db` only (profile `migrate`), run by deploy-stoktok
# before the app is replaced, never by `up -d` and never on a restore.
# This file reaches the deployment repo only as the second commit of the cutover release PR
# release/stoktok-vX.Y.Z (STK-094): with v0.2.1 pinned it would fail (no `migrate` command, no /readyz).

name: stoktok

services:
  stoktok-web:
    image: ${STOKTOK_WEB_IMAGE:?STOKTOK_WEB_IMAGE is unset - pass --env-file apps/stoktok/release.env}
    restart: unless-stopped
    env_file: /Users/mingming/.config/stoktok/stoktok.env
    environment:
      STOKTOK_VERSION: ${STOKTOK_VERSION:-}
      # Next's standalone server binds to $HOSTNAME, which Docker sets to the container id; bind
      # every interface so the health check on 127.0.0.1 reaches it.
      HOSTNAME: 0.0.0.0
      TZ: Asia/Ho_Chi_Minh # log readability only; core uses an explicit zone
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [tunnel, db]

  stoktok-worker:
    image: ${STOKTOK_WORKER_IMAGE:?STOKTOK_WORKER_IMAGE is unset - pass --env-file apps/stoktok/release.env}
    restart: "no"
    profiles: [jobs]
    env_file: /Users/mingming/.config/stoktok/stoktok.env
    environment:
      STOKTOK_VERSION: ${STOKTOK_VERSION:-}
      TZ: Asia/Ho_Chi_Minh
    # `db` is internal: keep `default` so the worker can still reach TCBS, VCI and the RSS feeds.
    networks: [default, db]

  migrate:
    image: ${STOKTOK_WORKER_IMAGE:?STOKTOK_WORKER_IMAGE is unset - pass --env-file apps/stoktok/release.env}
    restart: "no"
    profiles: [migrate]
    env_file: /Users/mingming/.config/stoktok/stoktok.env
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Worker image entrypoint is `node dist/cli.js`; `migrate` applies db/migrations (copied to /app/migrations).
    command: ["migrate"]
    # `db` only: the migrate run needs no egress.
    networks: [db]

networks:
  tunnel:
    external: true
    # The network cloudflared is on: `web`, created by proxy/compose.yml.
    name: web
  db:
    external: true
    # The shared Postgres network, created by postgres/compose.yml.
    name: db
